[workspace]
name = "pixi_ros2_rolling"
version = "0.1.0"
description = "Dependencies to build ROS 2 on Windows and Linux"
authors = ["Chris Lalancette <clalancette@gmail.com>"]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]
requires-pixi = ">=0.78"

[target.win-64.dependencies]
7zip = "==26.00"
osrf_pycommon = "==0.2.1"

[target.win-64.activation.env]
QT_QPA_PLATFORM_PLUGIN_PATH="%cd%\\.pixi\\envs\\default\\Library\\lib\\qt6\\plugins\\platforms"

[target.linux-64.dependencies]
binutils_linux-64 = "==2.46.1"  # Ubuntu has 2.46
freeglut = "==3.2.2"
freeimage = "==3.18.0"
gcc_linux-64 = "==15.2.0"
glew = "==2.2.0"
gxx_linux-64 = "==15.2.0"
libacl = "==2.3.2"
libgles-devel = "==1.7.0"
libgl-devel = "==1.7.0"
libglx-devel = "==1.7.0"
libglu = "==9.0.3"
libopengl-devel = "==1.7.0"
lttng-ust = "==2.13.9"  # TODO: Ubuntu has 2.14.0, but conda-forge has nothing newer than 2.13.9
make = "==4.4.1"
mesalib = ">=24.0,<26"
pkgconfig = "==1.5.5"
xorg-libxaw = "==1.0.14"
zziplib = "==0.13.69"

[dependencies]
# The following are "tooling" dependencies, used to install or initiate builds.
# We pin them less aggressively since they will presumably continue to their job,
# and we don't rely on any particular API or ABI for them to be stable.
colcon-cmake = ">=0.2.30,<0.3"
# Python 3.14 needs at least 0.18.2 here, even though the bound below is
# higher.  colcon overrides argparse's _parse_optional() so that
# '--cmake-args -DFOO=BAR' works at all, and it recognises the "could not
# classify" case by comparing against the exact value argparse returns.
# python/cpython#124631 changed that value to a list of tuples, so on 3.14 the
# override silently stops matching, every -D argument is treated as an unknown
# option, and colcon exits with 'unrecognized arguments'.  0.18.2 added the
# list form to that comparison; do not lower this bound past it.
colcon-core = ">=0.21.1,<0.22"
colcon-defaults = ">=0.2.9,<0.3"
colcon-library-path = ">=0.2.1,<0.3"
colcon-metadata = ">=0.2.5,<0.3"
colcon-mixin = ">=0.2.3,<0.3"
colcon-output = ">=0.2.14,<0.3"
colcon-package-information = ">=0.4.1,<0.5"
colcon-package-selection = ">=0.2.10,<0.3"
colcon-parallel-executor = ">=0.4.0,<0.5"
colcon-pkg-config = ">=0.1.0,<0.2"
colcon-powershell = ">=0.5.0,<0.6"
colcon-python-setup-py = ">=0.2.9,<0.3"
colcon-recursive-crawl = ">=0.2.3,<0.3"
colcon-ros = ">=0.5.0,<0.6"
colcon-ros-domain-id-coordinator = ">=0.2.4,<0.3"
colcon-test-result = ">=0.3.8,<0.4"

# The rest of the dependencies here are used by one or more ROS packages.  We aggressively
# pin them to particular versions that are as close as possible to their counterparts in Ubuntu.
argcomplete = "==3.6.3"
asio = "==1.36.0"  # TODO: Ubuntu has 1.30.2, but conda-forge jumps from 1.29.0 to 1.36.0
assimp = "==6.0.4"
benchmark = "==1.9.1"
bullet = "==3.25"  # TODO: Ubuntu has 3.24, but the conda-forge build of it requires numpy < 2
catkin_pkg = "==1.1.0"
cli11 = "==2.6.2"  # TODO: Ubuntu has 2.6.1, which conda-forge does not have
clang-tools = "==21.1.6"
cmake = "==4.2.3"
colorama = "==0.4.6"
console_bridge = "==1.0.1"
coverage = "==7.13.5"
cppcheck = "==2.20.1"  # TODO: Ubuntu has 2.19.0, and this version does not actually work, so we should just remove ament_cppcheck
cryptography = "==46.0.5"
cunit = "==2.1.3"
curl = "==8.18.0"
distlib = "==0.4.0"
docutils = "==0.22.4"
eigen = "==3.4.0"
empy = "==3.3.4"
flake8 = "==7.3.0"
flake8-blind-except = "==0.2.1"
flake8-builtins = "==3.1.0"
flake8-class-newline = "==1.6.0"
flake8-comprehensions = "==3.17.0"
flake8-deprecated = "==2.3.0"
flake8-import-order = "==0.19.2"
flake8-quotes = "==3.4.0"
freetype = "==2.14.3"  # TODO: Ubuntu has 2.14.2, but qt6-main 6.11 requires at least 2.14.3
git = ">=2.43.0"
gmock = "==1.17.0"
graphviz = "==14.1.2"
gtest = "==1.17.0"
importlib-metadata = "==8.7.1"
iniconfig = "==2.3.0"  # TODO: Ubuntu has 2.1.0, which conda-forge does not have
lark = "==1.3.1"
libcurl = "==8.18.0"
lxml = "==6.0.2"
lz4-c = "==1.10.0"
mccabe = "==0.7.0"
mypy = "==1.19.1"
mypy_extensions = "==1.1.0"
nlohmann_json = "==3.12.0"
numpy = "==2.3.5"
opencv = "==4.13.0"  # TODO: Ubuntu has 4.10.0, but conda-forge has no Python 3.14 build before 4.13.0
openssl = ">=3.4,<4"
orocos-kdl = "==1.5.2"
osrf_pycommon = "==0.2.1"
packaging = "==26.0"
pathspec = "==1.0.4"
pip = "*"  # Deliberately unpinned; there is no Ubuntu counterpart and pip likes to update itself
pluggy = "==1.6.0"
psutil = "==7.1.0"
pybind11 = "==3.0.1"
pycodestyle = "==2.14.0"
pydantic = "==2.12.5"
pydocstyle = "==6.3.0"
pydot = "==4.0.1"
pyflakes = "==3.4.0"
pygraphviz = "==1.14"
pyparsing = "==3.3.2"
# qt_gui_cpp generates its Python bindings with SIP and needs all three of
# these.  Without pyqt6 it cannot configure at all -- "PyQt6 SIP bindings are
# required but were not found" -- and without pyqt-builder it configures,
# compiles, and then dies in sip-build with "Unable to import 'pyqtbuild'".
# An apt-provisioned Ubuntu gets them from python3-pyqt6 and pyqt-builder, so
# the gap only shows up in a pixi environment, and only once the build reaches
# qt_gui_cpp.
pyqt-builder = ">=1.15,<2"  # No Ubuntu counterpart to pin against; provides the pyqtbuild module
pyqt6 = "==6.11.0"  # TODO: Ubuntu has 6.10.2, but conda-forge only builds 6.11.0 for Python 3.14
pyqt6-sip = "==13.10.0"  # TODO: Ubuntu has 13.11.0, which conda-forge does not have
pytest = "==9.0.2"
pytest-asyncio = "==1.3.0"
pytest-cov = "==5.0.0"
pytest-mock = "==3.15.1"
pytest-repeat = "==0.9.4"
pytest-rerunfailures = "==16.1"
pytest-runner = "==6.0.0"  # TODO: Ubuntu has 6.0.1, which conda-forge does not have
pytest-timeout = "==2.4.0"
python = "==3.14.3"
python-dateutil = "==2.9.0"
python-fastjsonschema = "==2.21.1"
python-orocos-kdl = "==1.5.2"
pyyaml = "==6.0.3"
qt6-main = "==6.11.0"  # TODO: Ubuntu has 6.10.2, but pyqt6 only builds against 6.11 for Python 3.14
rosdistro = "==1.0.1"
rust = "==1.93.1"
setuptools = "==78.1.1"
six = "==1.17.0"
snowballstemmer = "==2.2.0"
spdlog = "==1.15.0"
sqlite = ">=3.46,<4"
tinyxml2 = "==11.0.0"
types-pyyaml = "==6.0.3"
typing_extensions = "==4.15.0"
uncrustify = "==0.78.1"
vcstool = "==1.1.7"
yaml-cpp = "==0.8.0"
yamllint = "==1.37.0"
yaml = "==0.2.5"
zipp = "==3.23.0"
zstd = "==1.5.7"
